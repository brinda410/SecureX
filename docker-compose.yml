services:

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: securex-backend

    restart: unless-stopped

    env_file:
      - ./server/.env

    environment:
      NODE_ENV: production
      PORT: 5000

    ports:
      - "5000:5000"

    volumes:
      - securex-uploads:/app/uploads

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile

    container_name: securex-frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5173:80"

volumes:
  securex-uploads: